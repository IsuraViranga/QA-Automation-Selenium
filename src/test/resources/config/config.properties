# Application Configuration
app.url=http://localhost:8080/ui/login
app.admin.username=admin
app.admin.password=admin123

# User Credentials
app.user.username=testuser
app.user.password=test123

# Browser Configuration
browser=chrome
headless=false
browser.window.maximize=true
implicit.wait=10
explicit.wait=20
page.load.timeout=30

# Test Data
test.data.path=src/test/resources/testdata/
keyword.data.path=src/test/resources/keywords/

# Reporting
extent.report.path=test-output/ExtentReport.html
allure.results.directory=target/allure-results
screenshot.path=screenshots/

# Logging
log.path=logs/application.log
log.level=INFO

# API Configuration
api.base.url=http://localhost:8080/ui
api.timeout=30

# Email Configuration (for reports)
email.enabled=false
email.to=team@qforce.com
email.subject=Test Execution Report

# Retry Configuration
retry.count=1

# Environment
environment=QA
